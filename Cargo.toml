[package]
name = "pixie"
version = "0.1.0"
edition = "2024"
description = "A small, fast app launcher for Wayland: fuzzy search, frecency, desktop actions, a quick calculator and a frosted GTK4 popup"
license = "MIT"
repository = "https://github.com/athenameow/pixie"
readme = "README.md"
keywords = ["launcher", "wayland", "hyprland", "gtk4"]
categories = ["gui"]

[[bin]]
name = "pixie"
path = "src/shim.rs"

[[bin]]
name = "pixie-ui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
gio-unix = "0.22"
gtk = { version = "0.11", package = "gtk4", features = ["v4_20"] }
gtk4-layer-shell = "0.8"
libc = "0.2.191"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
